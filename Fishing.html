<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#264653">
<title>渔歌物语 · Fishing Tale</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#264653;font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;color:#264653;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ============ 主页 ============ */
#home{position:fixed;inset:0;background:#f5f0e1;display:flex;flex-direction:column;z-index:10;overflow-y:auto}
.topbar{background:#264653;color:#f5f0e1;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar h1{font-size:20px}
.topbar .sp{flex:1}
.pill{border-radius:999px;padding:3px 10px;font-weight:bold;font-size:13px}
.coin{background:#e9c46a;color:#264653}
.pearl{background:#a884f3;color:#fff}
.btnline{border:1px solid rgba(245,240,225,.5);border-radius:999px;padding:3px 10px;color:#f5f0e1;font-size:13px}
#home .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
#home .title{font-size:52px;letter-spacing:4px}
#home .sub{opacity:.7}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%;max-width:640px}
.modecard{padding:18px;border-radius:16px;border:4px solid rgba(38,70,83,.25);background:rgba(255,255,255,.6);text-align:left;transition:.15s}
.modecard.on{border-color:#f4a261;background:rgba(244,162,97,.15);box-shadow:0 6px 18px rgba(38,70,83,.25);transform:scale(1.02)}
.modecard .ic{font-size:30px}
.modecard .nm{font-size:20px;font-weight:bold;margin:4px 0}
.modecard .ds{font-size:13px;opacity:.7}
#startBtn{padding:14px 56px;border-radius:999px;background:#f4a261;border:4px solid #264653;font-size:24px;font-weight:900;box-shadow:0 6px 0 #264653;transition:.1s}
#startBtn:active{transform:translateY(4px);box-shadow:none}
.hint{font-size:11px;opacity:.5}

/* ============ 游戏 ============ */
#game{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
#hudTop{top:0;left:0;right:0;padding:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hudchip{background:rgba(38,70,83,.8);color:#f5f0e1;border:1px solid rgba(245,240,225,.3);border-radius:999px;padding:3px 10px;font-size:12px;backdrop-filter:blur(4px)}
.hudchip.on{background:#f4a261;color:#264653;border-color:#f4a261;font-weight:bold}
#hudBottom{bottom:6px;left:6px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
.gearchip{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:bold}
#phaseTip{top:38px;left:50%;transform:translateX(-50%);background:rgba(38,70,83,.8);color:#f5f0e1;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:bold;white-space:nowrap;pointer-events:none}
#phaseTip .blink{color:#e9c46a;animation:blink .4s infinite alternate}
@keyframes blink{to{opacity:.3}}

/* 红点提示 */
.redDot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#d63c3c;border:2px solid #f5f0e1;animation:blink .8s infinite alternate}
.hasdot{position:relative}

/* 路亚摇杆 + 拉线 */
#lureBtns{position:absolute;bottom:14px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px;pointer-events:none}
#lureBtns>*{pointer-events:auto}
#joyBase{width:130px;height:130px;border-radius:50%;background:rgba(38,70,83,.55);border:3px solid rgba(245,240,225,.35);position:relative;touch-action:none;backdrop-filter:blur(2px)}
#joyKnob{width:58px;height:58px;border-radius:50%;background:#f4a261;border:3px solid #264653;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:18px;color:#264653;font-weight:900}
#reelBtn{height:84px;width:84px;border-radius:50%;border:4px solid #264653;background:#6abe30;color:#fff;font-size:15px;font-weight:900;touch-action:none;line-height:1.2}
#reelBtn.on{background:#4d9be6;transform:scale(.93)}

/* ============ 菜单 ============ */
#menu{position:fixed;inset:0;background:#f5f0e1;z-index:20;display:flex;flex-direction:column}
#menu .body{flex:1;overflow-y:auto;padding:12px;max-width:760px;margin:0 auto;width:100%}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tab{padding:8px;border-radius:10px;border:2px solid rgba(38,70,83,.25);background:rgba(255,255,255,.5);font-weight:bold;font-size:14px}
.tab.on{background:#264653;color:#f5f0e1;border-color:#264653}
.secT{font-weight:bold;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{padding:8px;border-radius:10px;border:2px solid rgba(38,70,83,.25);background:rgba(255,255,255,.6);text-align:left;font-size:13px}
.card.on{border-color:#f4a261;background:rgba(244,162,97,.15)}
.card.lock{border-style:dashed;opacity:.45}
.card .nm{font-weight:bold}
.card .sm{font-size:10px;opacity:.6}
.tier{display:inline-block;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:4px;margin-right:4px}
.bswitch{display:flex;gap:6px;margin-bottom:10px}
.bswitch button{padding:6px 14px;border-radius:999px;border:2px solid rgba(38,70,83,.3);font-weight:bold;font-size:13px}
.bswitch button.on{background:#264653;color:#f5f0e1;border-color:#264653}
.qcard{padding:10px;border-radius:10px;border:2px solid rgba(38,70,83,.25);background:rgba(255,255,255,.6);margin-bottom:8px}
.qcard.done{border-color:#6abe30;background:rgba(106,190,48,.1)}
.qcard.claimed{opacity:.6;border-color:rgba(38,70,83,.15)}
.qbar{height:6px;border-radius:3px;background:rgba(38,70,83,.15);margin-top:6px;overflow:hidden}
.qbar i{display:block;height:100%;background:#f4a261}
.claimbtn{padding:4px 14px;border-radius:999px;background:#6abe30;color:#fff;font-weight:bold;font-size:12px;animation:blink .8s infinite alternate}
.rowbet{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* ============ 弹窗 ============ */
.modal{position:fixed;inset:0;background:rgba(38,70,83,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#f5f0e1;border:4px solid #264653;border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mbox h2{font-size:22px;margin-bottom:4px}
.mbtn{padding:10px;border-radius:999px;font-weight:bold;flex:1;border:2px solid #264653}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:50;background:#264653;color:#f5f0e1;padding:8px 20px;border-radius:999px;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* ============ 竖屏旋转提示 ============ */
#rotateTip{position:fixed;inset:0;z-index:100;background:#264653;color:#f5f0e1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
#rotateTip .phone{font-size:64px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){
  #rotateTip{display:flex}
}
</style>
</head>
<body>

<div id="rotateTip">
  <div class="phone">📱</div>
  <div id="rotateText" style="font-size:20px;font-weight:bold">请横屏游玩<br><span style="font-size:13px;opacity:.7">Please rotate to landscape</span></div>
</div>

<!-- ============ 主页 ============ -->
<div id="home">
  <div class="topbar">
    <h1>🎣 <span data-i18n="gameTitle"></span></h1>
    <span class="sp"></span>
    <span class="pill coin">🪙 <span id="homeCoins">0</span></span>
    <span class="pill pearl">🦪 <span id="homePearls">0</span></span>
    <span class="pill" style="background:#6abe30">⭐ Lv.<span id="homeLevel">1</span></span>
    <button class="btnline" onclick="toggleLang()" id="langBtn1">EN</button>
    <button class="btnline" onclick="showConfirmNew()" data-i18n="newGame"></button>
  </div>
  <div class="center">
    <div class="title" data-i18n="gameTitle"></div>
    <div class="sub" data-i18n="subtitle"></div>
    <div style="font-weight:bold" data-i18n="chooseMode"></div>
    <div class="modes">
      <button class="modecard" id="modeLure" onclick="setMode('lure')">
        <div class="ic">🎣</div><div class="nm" data-i18n="lureBranch"></div><div class="ds" data-i18n="lureDesc"></div>
      </button>
      <button class="modecard" id="modeFloat" onclick="setMode('float')">
        <div class="ic">🎋</div><div class="nm" data-i18n="floatBranch"></div><div class="ds" data-i18n="floatDesc"></div>
      </button>
    </div>
    <button id="startBtn" onclick="startGame()"><span data-i18n="startGame"></span> ➜</button>
    <div class="hint">💾 <span data-i18n="autoSaved"></span> · <span data-i18n="totalCaught"></span> <span id="homeTotal">0</span></div>
  </div>
</div>

<!-- ============ 游戏 ============ -->
<div id="game" class="hidden">
  <canvas id="cv"></canvas>
  <div class="hud" id="hudTop">
    <button class="hudchip" onclick="goHome()">‹ <span data-i18n="backHome"></span></button>
    <span class="hudchip on" id="modeChip"></span>
    <span id="areaChips"></span>
    <span style="flex:1"></span>
    <span class="hudchip" style="background:#e9c46a;color:#264653">🪙 <span id="gCoins">0</span></span>
    <span class="hudchip" style="background:#a884f3">🦪 <span id="gPearls">0</span></span>
    <button class="hudchip hasdot" id="menuBtn" style="background:#f4a261;color:#264653;font-weight:900" onclick="openMenu()">☰ <span data-i18n="menu"></span></button>
  </div>
  <div class="hud" id="phaseTip"></div>
  <div class="hud" id="hudBottom"></div>
  <div id="lureBtns" class="hidden">
    <div id="joyBase">
      <span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:rgba(245,240,225,.7);font-size:14px;pointer-events:none">◀</span>
      <span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);color:rgba(245,240,225,.7);font-size:14px;pointer-events:none">▶</span>
      <div id="joyKnob">🎣</div>
    </div>
    <button id="reelBtn">⤵<br><span data-i18n="reel"></span></button>
  </div>
</div>

<!-- ============ 菜单 ============ -->
<div id="menu" class="hidden">
  <div class="topbar">
    <span style="font-weight:bold;font-size:18px">☰ <span data-i18n="menu"></span></span>
    <span class="sp"></span>
    <button class="hudchip" onclick="toggleLang()" id="langBtn2">EN</button>
    <button class="hudchip" style="background:#f4a261;color:#264653;font-weight:bold" onclick="closeMenu()"><span data-i18n="back"></span> ✕</button>
  </div>
  <div class="body">
    <div class="tabs" style="grid-template-columns:repeat(5,1fr)">
      <button class="tab on hasdot" data-tab="gear">🛠️ <span data-i18n="assembly"></span></button>
      <button class="tab hasdot" data-tab="codex">📖 <span data-i18n="codex"></span></button>
      <button class="tab hasdot" data-tab="bag">🧺 <span data-i18n="bag"></span></button>
      <button class="tab hasdot" data-tab="quests">📜 <span data-i18n="quests"></span></button>
      <button class="tab hasdot" data-tab="shop">🏪 <span data-i18n="shop"></span></button>
    </div>
    <div id="menuContent"></div>
  </div>
</div>

<!-- ============ 弹窗 ============ -->
<div id="modalWrap"></div>
<div id="toast" class="hidden"></div>

<script>
'use strict';
/* ==================== i18n ==================== */
const DICT = {
gameTitle:['渔歌物语','Fishing Tale'],subtitle:['星露谷式 2D 钓鱼','A cozy 2D fishing game'],
gear:['装备','Gear'],codex:['图鉴','Codex'],quests:['任务','Quests'],shop:['商店','Shop'],
rod:['鱼竿','Rod'],line:['鱼线','Line'],bait:['鱼饵','Bait'],lureBranch:['路亚','Lure'],floatBranch:['台钓','Float'],
owned:['已拥有','Owned'],equipped:['已装备','Equipped'],locked:['未解锁','Locked'],
cast:['抛竿','Cast'],casting:['蓄力抛竿…','Charging…'],waiting:['等待鱼儿上钩…','Waiting for a bite…'],
bite:['咬钩了！','Bite!'],hook:['收竿！','Hook!'],progress:['进度','Progress'],
caught:['钓到了！','Caught!'],escaped:['鱼跑了…','It escaped…'],lineBreak:['鱼线断了！','Line broke!'],
newRecord:['新纪录！','New record!'],weight:['重量','Weight'],sell:['出售','Sell'],keep:['收入鱼篓','Keep'],
bag:['鱼篓','Bag'],bagEmpty:['鱼篓是空的','Your bag is empty'],sellAll:['一键出售全部鱼获','Sell all fish'],
reward:['奖励','Reward'],claim:['领取','Claim'],claimed:['已领取','Claimed'],
save:['存档','Save'],autoSaved:['已自动保存','Auto-saved'],saved:['已保存','Saved'],
newGame:['新游戏','New Game'],confirmNew:['确定要覆盖当前存档重新开始吗？','Overwrite current save and start over?'],
confirm:['确定','Confirm'],cancel:['取消','Cancel'],back:['返回','Back'],
caughtCount:['已捕获','Caught'],totalSpecies:['图鉴进度','Codex progress'],

unknown:['???','???'],maxWeight:['最大纪录','Best'],firstCatch:['首次捕获','First catch'],

pearlChance:['有几率获得珍珠','Chance to drop pearls'],sellFor:['售价','Sells for'],
totalCaught:['累计钓获','Total caught'],playTime:['游玩时长','Play time'],minutes:['分钟','min'],
startGame:['开始钓鱼','Start Fishing'],chooseMode:['选择钓鱼方式','Choose your style'],

infiniteBait:['无限','Infinite'],minPriceHint:['非最低级鱼饵：每条鱼保底2币；最低级鱼饵：保底1币；路亚钓获保底6币','Better bait: min 2; basic bait: min 1; lure catch: min 6'],
steerLeft:['◀ 左拉杆','◀ Steer Left'],steerRight:['右拉杆 ▶','Steer Right ▶'],
tension:['张力','Tension'],fishDistance:['距离','Distance'],
lureFightHint:['逆着鱼的方向拉杆耗体力，按住「拉线」收近；张力爆红会断线！','Steer against the fish, hold Reel to pull in — max tension breaks the line!'],
floatFightHint:['按住/触摸抬升，松开下降，让鱼保持在绿色区间内','Hold to raise, release to drop. Keep the fish in the green zone'],

breakOk:['突破成功！','Breakthrough success!'],lvCapHint:['已达当前等级上限，需要突破才能继续升级','Level cap reached — breakthrough required to keep leveling'],

let LANG='zh';
const T=k=>DICT[k][LANG==='zh'?0:1];

/* ==================== 数据 ==================== */
const TIER_COLORS=['#e8e2d0','#6abe30','#4d9be6','#a884f3','#f47c2c','#d63c3c'];
const TIER_TXT=['#264653','#fff','#fff','#fff','#fff','#fff'];
const TIER_KEYS=['rarityWhite','rarityGreen','rarityBlue','rarityPurple','rarityOrange','rarityRed'];

const lineG=(br,ti,zh,en)=>({id:`line_${br}_${ti}`,branch:br,tier:ti,zh,en,power:0,strength:0.16+ti*0.045,luck:0,biteRate:0,price:0,pearlPrice:0});
const baitG=(br,ti,zh,en,price,pearlPrice=0)=>({id:`bait_${br}_${ti}`,branch:br,tier:ti,zh,en,power:0,strength:0,luck:ti*0.06,biteRate:1+ti*0.18,price,pearlPrice});

const RODS=[rodG('lure',0,'竹节路亚竿','Bamboo Lure Rod'),rodG('lure',1,'碳素路亚竿','Carbon Lure Rod'),rodG('lure',2,'疾风路亚竿','Gale Lure Rod'),rodG('lure',3,'幻影路亚竿','Phantom Lure Rod'),rodG('lure',4,'龙王路亚竿','Dragon King Rod'),rodG('lure',5,'海神路亚竿','Poseidon Rod'),
rodG('float',0,'老式竹竿','Old Bamboo Pole'),rodG('float',1,'玻璃钢台钓竿','Fiberglass Pole'),rodG('float',2,'浪尖台钓竿','Wavecrest Pole'),rodG('float',3,'玄铁台钓竿','Darksteel Pole'),rodG('float',4,'金鳞台钓竿','Goldscale Pole'),rodG('float',5,'乾坤台钓竿','Cosmos Pole')];
const LINES=[lineG('lure',0,'棉丝路亚线','Cotton Lure Line'),lineG('lure',1,'尼龙路亚线','Nylon Lure Line'),lineG('lure',2,'PE编织线','PE Braid'),lineG('lure',3,'碳氟前导线','Fluorocarbon Leader'),lineG('lure',4,'银鳞飞线','Silverscale Line'),lineG('lure',5,'龙筋神线','Dragon Sinew Line'),
lineG('float',0,'麻线','Hemp Line'),lineG('float',1,'尼龙台钓线','Nylon Float Line'),lineG('float',2,'竞技台钓线','Match Float Line'),lineG('float',3,'纳米复合线','Nano Composite Line'),lineG('float',4,'水晶隐线','Crystal Stealth Line'),lineG('float',5,'天蚕丝线','Celestial Silk Line')];
const BAITS=[baitG('lure',0,'铁片亮片','Tin Spoon',20),baitG('lure',1,'摇摆米诺','Minnow Wobbler',60),baitG('lure',2,'水面波扒','Topwater Popper',150),baitG('lure',3,'幻影软虫','Phantom Soft Worm',400,3),baitG('lure',4,'深潜铁板','Deep Jig',1000,8),baitG('lure',5,'龙吟雷蛙','Dragoncroak Frog',0,20),

/* ==================== 每日任务 ==================== */
function seededRand(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
function genDailies(dateStr){
  const seed=[...dateStr].reduce((a,c)=>a*31+c.charCodeAt(0),7);
  const rnd=seededRand(seed);
  const out=[];const used=new Set();
  /* 从已解锁海域的鱼里抽「钓X条某鱼」任务 */
  const ua=unlockedAreas();
  const pool=FISH.filter(f=>ua.includes(f.area));
  for(let i=0;i<6&&pool.length;i++){
    const f=pool[Math.floor(rnd()*pool.length)];
    const key='fish_'+f.id;if(used.has(key)){i--;continue;}used.add(key);
    const cnt=2+Math.floor(rnd()*4);
    out.push({id:'d_f_'+f.id,zh:`每日·钓${cnt}条${f.zh}`,en:`Daily: ${f.en} ×${cnt}`,
      req:{kind:'catchFish',fishId:f.id,count:cnt},
      rewards:[{kind:'coins',count:30+cnt*15+Math.floor(rnd()*40)}],daily:true,branch:f.branch});
  }
  /* 通用任务 */
  const gens=[
    ()=>({id:'d_species',zh:`每日·图鉴+${2+Math.floor(rnd()*2)}`,en:`Daily: +${2} species`,req:{kind:'species',count:speciesCount()+2},rewards:[{kind:'pearls',count:1+Math.floor(rnd()*2)}],daily:true,branch:'both'}),
    ()=>({id:'d_coins',zh:'每日·赚取500金币',en:'Daily: Earn 500 coins',req:{kind:'earnCoins',count:S.earnedCoins+500},rewards:[{kind:'pearls',count:2}],daily:true,branch:'both'}),
    ()=>{const a=ua[Math.floor(rnd()*ua.length)];const an=AREAS[a];return{id:'d_area'+a,zh:`每日·在${an.zh}钓5条`,en:`Daily: 5 fish in ${an.en}`,req:{kind:'catchArea',area:a,count:5},rewards:[{kind:'coins',count:80+Math.floor(rnd()*60)}],daily:true,branch:'both'};},
    ()=>{const br=rnd()<0.5?'lure':'float';const bn=br==='lure'?(LANG==='zh'?'路亚':'Lure'):(LANG==='zh'?'台钓':'Float');return{id:'d_br_'+br,zh:`每日·用${br==='lure'?'路亚':'台钓'}钓4条`,en:`Daily: 4 fish with ${bn}`,req:{kind:'catchBranch',branch:br,count:4},rewards:[{kind:'bait',gearId:br==='lure'?'bait_lure_1':'bait_float_1',count:4}],daily:true,branch:br};},
  ];
  for(let i=0;i<4;i++){const g=gens[Math.floor(rnd()*gens.length)]();if(used.has(g.id)){i--;continue;}used.add(g.id);out.push(g);}
  return out;
}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
function getDailies(){
  const t=todayStr();
  if(!S.daily||S.daily.date!==t){S.daily={date:t,quests:genDailies(t)};persist();}
  return S.daily.quests;
}
function allQuests(){return[...QUESTS,...getDailies()];}
const findQuest=qid=>allQuests().find(q=>q.id===qid);

function defaultSave(){return{version:1,lang:'zh',coins:100,pearls:0,
rods:['rod_lure_0','rod_float_0'],lines:['line_lure_0','line_float_0'],
baits:{bait_lure_0:10,bait_float_0:10},
equipped:{lure:{rod:'rod_lure_0',line:'line_lure_0',bait:'bait_lure_0'},float:{rod:'rod_float_0',line:'line_float_0',bait:'bait_float_0'}},
codex:{},codexSeen:{},bag:[],quests:{},totalCaught:0,earnedCoins:0,playMinutes:0,daily:null,branchCaught:{lure:0,float:0},level:1,xp:0,bk:0};}
let S=(()=>{try{const r=localStorage.getItem(SAVE_KEY);if(!r)return defaultSave();const d=JSON.parse(r);if(d.version!==1)return defaultSave();return Object.assign(defaultSave(),d);}catch(e){return defaultSave();}})();

/* 旧存档可能缺 2-5 级鱼线（历史任务奖励丢失），按持有竿档补齐 */
S.rods.forEach(rid=>{const t=gearById(rid).tier,br=gearById(rid).branch,lid=`line_${br}_${t}`;
  if(t>0&&!S.lines.includes(lid))S.lines.push(lid);});

/* ==================== 钓鱼等级 & 突破 ==================== */
const MAX_LV=240;
const lvCap=()=>Math.min(MAX_LV,(S.bk+1)*10); /* 当前等级上限：每突破一次 +10 */
const xpNeed=L=>20+12*L; /* L 级升到 L+1 所需经验 */
function addXp(n){
  if(S.level>=MAX_LV)return;
  if(S.level>=lvCap()){updateBadges();return;} /* 到顶，需先突破 */
  S.xp+=n;
  while(S.level<lvCap()&&S.xp>=xpNeed(S.level)){
    S.xp-=xpNeed(S.level);S.level++;
    const rw=10+S.level*2;S.coins+=rw;S.earnedCoins+=rw;
    toast(`🎉 ${T('levelUp')} Lv.${S.level} +${rw} 🪙`);
  }
  if(S.level>=lvCap()){S.xp=0;if(S.level<MAX_LV)toast(T('lvCapHint'));} /* 到达上限，经验封存待突破 */
  persist();updateBadges();
}

 {req:{pond_crucian:2,pond_topmouth:2}},                              /* Lv10 */
 {req:{pond_carp:2,pond_betta:2}},                                    /* Lv20 */

 {req:{river_mandarin:1,river_black:1,river_eel:1}},                  /* Lv60 */
 {req:{river_sakura:2,river_culter:2,river_fire:1}},                  /* Lv70 */
 {req:{shore_sardine:4,shore_rockfish:2}},                            /* Lv80 */
 {req:{shore_seabass:2,shore_blacksea:2,shore_flounder:2}},           /* Lv90 */
 {req:{shore_croaker:2,shore_cutlass:2}},                             /* Lv100 */
 {req:{shore_puffer:1,shore_octopus:2,shore_mackerel:2}},             /* Lv110 */
 {req:{shore_redbream:1,shore_ribbon:1,shore_glowsquid:1}},           /* Lv120 */
 {req:{deep_lantern:2,deep_redsnap:2}},                               /* Lv130 */
 {req:{deep_tuna:2,deep_grouper:1}},                                  /* Lv140 */
 {req:{deep_angler:1,deep_sunfish:1}},                                /* Lv150 */
 {req:{deep_sailfish:1,deep_giant:1}},                                /* Lv160 */
 {req:{deep_marlin:1,deep_lantern:2}},                                /* Lv170 */
 {req:{deep_oarfish:1,deep_tuna:2}},                                  /* Lv180 */
 {req:{deep_moonfish:1,deep_grouper:2}},                              /* Lv190 */
 {req:{deep_shark:1}},                                                /* Lv200 */
 {req:{deep_ghost:1,deep_angler:1}},                                  /* Lv210 */
 {req:{deep_marlin:1,deep_sailfish:1}},                               /* Lv220 */
 {req:{deep_shark:1,deep_moonfish:1}}                                 /* Lv230 */
];
const breakNeed=()=>(S.level>=lvCap()&&lvCap()<MAX_LV)?(BREAKS[S.bk]||null):null;
const bagCount=fid=>S.bag.filter(b=>b.fishId===fid).length;
const canBreak=()=>{const b=breakNeed();return !!b&&Object.entries(b.req).every(([id,c])=>bagCount(id)>=c);};
function doBreak(){
  const b=breakNeed();if(!b||!canBreak())return;
  for(const [id,c] of Object.entries(b.req)){let left=c;
    S.bag=S.bag.filter(x=>x.fishId===id&&left>0?(left--,false):true);}
  S.bk++;
  const coins=60*S.bk, pearls=1+Math.floor(S.bk/4);
  S.coins+=coins;S.earnedCoins+=coins;S.pearls+=pearls;
  persist();updateBadges();refreshHUD();closeModal();
  toast(`⬆ ${T('breakOk')} +${coins} 🪙 +${pearls} 🦪`);
}
function showBreakModal(){
  const b=breakNeed();if(!b)return;
  const nextCap=Math.min(MAX_LV,(S.bk+2)*10);
  const rows=Object.entries(b.req).map(([id,c])=>{
    const f=FISH.find(x=>x.id===id),have=bagCount(id);
    return`<div class="rowbet" style="margin:6px 0"><span>${tierBadgeHTML(f.needTier)}${fname(f)}</span>
      <b style="color:${have>=c?'#6abe30':'#d63c3c'}">${have}/${c}</b></div>`;}).join('');
  showModal(`<div class="mbox"><h2>⬆ ${T('breakthrough')} · Lv.${S.level} → ${nextCap}</h2>
  <p class="sm" style="opacity:.7">${T('breakHint')}</p>${rows}
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="mbtn" style="background:#6abe30;color:#fff" ${canBreak()?'':'disabled'} onclick="doBreak()">${T('breakNow')}</button>
    <button class="mbtn" onclick="closeModal()">${T('cancel')}</button></div></div>`);
}
function questProgress(req){
  switch(req.kind){
    case 'catchFish':return{cur:S.codex[req.fishId]?.count||0,max:req.count};
    case 'catchTier':return{cur:FISH.filter(f=>f.needTier===req.tier).reduce((s,f)=>s+(S.codex[f.id]?.count||0),0),max:req.count};
    case 'catchArea':return{cur:FISH.filter(f=>f.area===req.area).reduce((s,f)=>s+(S.codex[f.id]?.count||0),0),max:req.count};
    case 'species':return{cur:speciesCount(),max:req.count};
    case 'earnCoins':return{cur:Math.floor(S.earnedCoins),max:req.count};
    case 'catchBranch':return{cur:(S.branchCaught&&S.branchCaught[req.branch])||0,max:req.count};
    case 'level':return{cur:S.level||1,max:req.count};
    case 'catchTotal':return{cur:S.totalCaught,max:req.count};
    case 'pearlFish':return{cur:S.pearlFish||0,max:req.count};}}
const questDone=q=>{const p=questProgress(q.req);return p.cur>=p.max;};

/* 红点提示 */
function hasClaimable(){return allQuests().some(q=>questDone(q)&&!(S.quests[q.id]&&S.quests[q.id].claimed));}

}
/* 昼夜时段：游戏内时间（可变速）6-10 清晨 / 10-17 白天 / 17-21 黄昏 / 21-6 夜晚 */
let gameMin=new Date().getHours()*60+new Date().getMinutes(); /* 游戏内分钟 0-1440 */
let timeRate=1; /* 1/2/4/8 倍速，不存档，每次进入游戏重置为 1 */
const RATE_COST={1:0,2:0,4:0.3,8:1}; /* 每游戏分钟金币花费（扣费时向上取整）：×4=18币/游戏小时，×8=60币/游戏小时 */
function timeOfDay(){const h=Math.floor(gameMin/60)%24;
  if(h>=6&&h<10)return'dawn';if(h>=10&&h<17)return'day';if(h>=17&&h<21)return'dusk';return'night';}
function cycleTimeRate(){
  const order=[1,2,4,8];let r=order[(order.indexOf(timeRate)+1)%4];
  /* 付费档位要求至少 1 枚完整金币，防止小数余额白嫖加速 */
  if(r>2&&S.coins<1){toast(T('notEnough'));return;}
  timeRate=r;refreshHUD();
}
let coinTick=0, lastMinQ=-1;
function fishPool(areaId,branch,rodTier){
  const tod=timeOfDay();
  let pool=FISH.filter(f=>f.area===areaId&&(f.branch==='both'||f.branch===branch)&&f.needTier<=rodTier
    &&(!f.time||f.time===tod));
  if(!pool.length){const all=FISH.filter(f=>f.area===areaId&&(f.branch==='both'||f.branch===branch));const m=Math.min(...all.map(f=>f.needTier));pool=all.filter(f=>f.needTier===m);}
  return pool;}
function rollFish(areaId,branch,rodTier,luck,dist,baitTier){
  const pool=fishPool(areaId,branch,rodTier);
  /* 抛得越远，高 needTier 鱼权重越高；贴岸(dist≈0)时高级鱼权重×0.3，低级鱼不变 */
  const w=pool.map(f=>{
    const tierFactor=f.needTier===0?1:(0.3+dist*1.4);
    /* 饵料保底：低于饵料等级的鱼权重×0.02，等于/高于饵料等级的鱼×3 */
    const baitFactor=baitTier>0?(f.needTier>=baitTier?3:0.02):1;
    return f.baseRate*(1+(luck+dist)*f.difficulty)*tierFactor*baitFactor;});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];}

function startCharge(){

let catchBaitTier=0;
function releaseCast(){
  if(phase!=='charging')return;
  const bid=eq().bait, bg=gearById(bid), n=S.baits[bid]||0;
  catchBaitTier=bg.tier;
  if(!(bg.tier===0&&n<=0)){ /* 无限备用饵不消耗 */
    S.baits[bid]=n-1;
    if(S.baits[bid]<=0){ /* 耗尽自动换回该分支最低级饵 */
      const t0=BAITS.find(b=>b.branch===mode&&b.tier===0);
      if(t0&&eq().bait!==t0.id){S.equipped[mode].bait=t0.id;toast(T('autoEquip'));}
    }
  }
  persist();
  finished=false;
  distBonus=castPower*0.35;
  bobX=320+castPower*480;bobY=waterY+14;
  targetFish=rollFish(areaId,mode,rod().tier,bait().luck,distBonus,catchBaitTier);
  waitTime=(2+Math.random()*4.5)/bait().biteRate;
  biteTimer=0;phase='waiting';updatePhaseUI();refreshHUD();
}
function beginFight(){
  perfect=true;
  if(mode==='float'){fishY=0.5;zoneY=0.7;progress=0.35;outTime=0;}
  else{stamina=1;distance=castPower;tension=0;fishDir=Math.random()<0.5?-1:1;dirTimer=0;
    /* 重量级大鱼近岸挣扎：体重越大越容易突然外冲几十米 */
    const hw=(targetFish.maxKg+targetFish.minKg)/2;
    if(hw>=15&&Math.random()<0.35+hw/200)distance=Math.min(1.2,distance+0.2+Math.min(0.5,hw/80));}
  phase='fight';updatePhaseUI();
  /* 装备碾压判定：橙色/红色高级鱼，竿或线品质不足时战斗开始 1 秒内直接脱钩 */
  if(targetFish.needTier>=4&&(rod().tier<targetFish.needTier||line().tier<targetFish.needTier)){
    setTimeout(()=>{if(phase==='fight'){toast(T('tooHeavy'));finishFight(false,true);}},800);
  }
}
function finishFight(win,broke=false){
  if(finished)return;finished=true;
  phase='done';updatePhaseUI();
  if(win&&targetFish){
    const f=targetFish;
    const kg=+(f.minKg+Math.random()*(f.maxKg-f.minKg)).toFixed(2);
    const prev=S.codex[f.id];
    const pearl=Math.random()<f.pearlChance+(perfect?0.05:0);
    if(pearl)S.pearls++;
    if(pearl)S.pearlFish=(S.pearlFish||0)+1;
    S.totalCaught++;
    S.branchCaught=S.branchCaught||{lure:0,float:0};
    S.branchCaught[mode]++;
    S.codex[f.id]={count:(prev?.count||0)+1,best:Math.max(prev?.best||0,kg)};
    persist();updateBadges();
    /* 售价保底：非最低级饵 2 币/条，最低级饵 1 币/条，路亚模式保底 6 币 */
    const floor=mode==='lure'?6:(catchBaitTier>0?2:1);
    const value=Math.max(floor,Math.round(f.price*kg*(perfect?1.25:1)));
    lastCatch={fish:f,kg,perfect,value,newSpecies:!prev,newBest:!!prev&&kg>prev.best,pearl};
    addXp(5+Math.round(value*0.5)+f.needTier*10+(perfect?10:0)); /* 钓获经验 */
    refreshHUD();
    setTimeout(()=>showCatchModal(lastCatch),350);
  }else{
    setTimeout(()=>showEscapeModal(broke),350);
  }
}

/* 虚拟摇杆（路亚拉杆） */
const joyBase=document.getElementById('joyBase'), joyKnob=document.getElementById('joyKnob');
let joyId=null;
function joyMove(e){
  const r=joyBase.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const max=r.width/2-14;
  const len=Math.hypot(dx,dy)||1;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joyKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const nx=dx/max;
  steer=Math.abs(nx)>0.25?(nx>0?1:-1):0;
}
joyBase.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joyId=e.pointerId;joyBase.setPointerCapture(joyId);joyMove(e);});
joyBase.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e);});
const joyEnd=e=>{if(e.pointerId===joyId){joyId=null;steer=0;joyKnob.style.transform='translate(-50%,-50%)';}};
joyBase.addEventListener('pointerup',joyEnd);joyBase.addEventListener('pointercancel',joyEnd);

function claimQuest(qid){

    if(r.kind==='coins'){S.coins+=r.count;S.earnedCoins+=r.count;}
    else if(r.kind==='pearls')S.pearls+=r.count;
    else if(r.kind==='gear'){
      if(r.gearId.startsWith('rod')){if(!S.rods.includes(r.gearId))S.rods.push(r.gearId);}
      else if(r.gearId.startsWith('line')){if(!S.lines.includes(r.gearId))S.lines.push(r.gearId);}
      else S.baits[r.gearId]=(S.baits[r.gearId]||0)+1;}
    else if(r.kind==='bait')S.baits[r.gearId]=(S.baits[r.gearId]||0)+r.count;}
  S.quests[qid]={claimed:true};persist();updateBadges();toast(T('claimed')+' ✓');renderMenu();}
function buyBait(id,usePearl){

/* ==================== 主循环 ==================== */
let last=performance.now(), time=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  const inGame=!document.getElementById('game').classList.contains('hidden');

  if(inGame){
    /* 游戏内时间流逝：8 现实秒 = 1 游戏分钟，可加速；4/8 倍速按经过的游戏分钟扣金币，钱不够自动降回免费档 */
    const advMin=dt/8*timeRate;
    gameMin=(gameMin+advMin)%1440;
    if(timeRate>1){
      coinTick+=advMin;
      if(coinTick>=1){const whole=Math.floor(coinTick),cost=Math.ceil(whole*RATE_COST[timeRate]);
        if(S.coins-cost>=1){S.coins=Math.round((S.coins-cost)*100)/100;coinTick-=whole;refreshHUD();}
        else{timeRate=2;coinTick=0;refreshHUD();}}
      /* 保底巡检：余额不足 1 币时立刻降回免费档 */
      if(S.coins<1&&timeRate>2){timeRate=2;coinTick=0;refreshHUD();}
    }
    if(Math.floor(gameMin*4)!==lastMinQ){lastMinQ=Math.floor(gameMin*4);refreshHUD();}
    /* 逻辑 */
    if(phase==='charging'){castPower+=castDir*dt*1.4;
      if(castPower>1){castPower=1;castDir=-1;}if(castPower<0){castPower=0;castDir=1;}}
    else if(phase==='waiting'){biteTimer+=dt;
      if(biteTimer>=waitTime&&targetFish){biteTimer=0;phase='bite';updatePhaseUI();}}
    else if(phase==='bite'){biteTimer+=dt;if(biteTimer>1.8)finishFight(false);}
    else if(phase==='fight'){
      const f=targetFish;
      if(mode==='float'){
        fishVy+=(Math.random()-0.5)*f.difficulty*dt*6;
        fishVy+=Math.sin(time*(1.5+f.difficulty))*f.difficulty*dt*1.6;
        fishVy*=0.94;
        fishY+=fishVy*dt*(0.5+f.difficulty*0.35);
        fishY=Math.max(0.02,Math.min(0.98,fishY));
        zoneY+=(holding?-0.9:0.9)*dt;
        const zh=0.16+line().strength*0.5;
        zoneY=Math.max(zh/2,Math.min(1-zh/2,zoneY));
        const inZone=Math.abs(fishY-zoneY)<zh/2+0.03;
        if(inZone){progress+=dt*rod().power*0.16;outTime=0;}
        else{progress-=dt*0.10;outTime+=dt;perfect=false;
          if(outTime>1.2+line().strength*4&&Math.random()<dt*(0.9-line().strength))finishFight(false,true);}
        if(phase==='fight'){if(progress>=1)finishFight(true);else if(progress<=0)finishFight(false);}
      }else{
        dirTimer-=dt;
        if(dirTimer<=0){fishDir=Math.random()<0.5?-1:1;dirTimer=0.5+Math.random()*(1.6-f.difficulty*0.4);}
        const counter=steer===-fishDir;
        if(counter)stamina-=dt*rod().power*0.55;else stamina=Math.min(1,stamina+dt*0.18);
        if(reeling){distance-=dt*rod().power*0.14*(1+(1-stamina)*0.8);
          tension+=dt*(0.3+stamina*f.difficulty*0.45+(counter?0:0.2));}
        else tension-=dt*(0.7+line().strength*0.6);
        tension=Math.max(0,tension);
        if(stamina>0.3)distance+=dt*0.045*f.difficulty*stamina;
        stamina=Math.max(0,stamina);
        /* 张力超过 1.3 才有断线风险，红线警示从 0.95 开始 */
        if(tension>1.3){perfect=false;
          if(Math.random()<dt*(1.4-line().strength*4))finishFight(false,true);}
        if(phase==='fight'){if(distance<=0)finishFight(true);else if(distance>castPower+0.5){perfect=false;finishFight(false);}}
      }
    }

    /* 绘制 */
    const a=area();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle=a.waterBot;ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(scale,0,0,scale,ox,oy);
    const tod=timeOfDay();
    const tint={dawn:[0.15,'#f4a261'],day:[0,null],dusk:[0.2,'#e76f51'],night:[0.45,'#0a1628']}[tod];
    const sky=ctx.createLinearGradient(0,0,0,waterY);
    sky.addColorStop(0,a.skyTop);sky.addColorStop(1,a.skyBot);
    ctx.fillStyle=sky;ctx.fillRect(0,0,LW,waterY+2);
    ctx.fillStyle=tod==='night'?'#f5f0e1':areaId===3?'#e9c46a':'#f4a261';
    ctx.beginPath();ctx.arc(LW*0.78,waterY*0.32,34,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.arc(LW*0.78,waterY*0.32,48,0,7);ctx.fill();
    ctx.fillStyle='rgba(38,70,83,.18)';
    ctx.beginPath();ctx.moveTo(0,waterY);
    for(let x=0;x<=LW;x+=60)ctx.lineTo(x,waterY-30-Math.sin(x*0.013)*26);
    ctx.lineTo(LW,waterY);ctx.closePath();ctx.fill();
    const water=ctx.createLinearGradient(0,waterY,0,LH);
    water.addColorStop(0,a.waterTop);water.addColorStop(1,a.waterBot);
    ctx.fillStyle=water;ctx.fillRect(0,waterY,LW,LH-waterY);
    ctx.strokeStyle='rgba(245,240,225,.35)';ctx.lineWidth=2;
    for(let i=0;i<9;i++){const y=waterY+16+i*(LH-waterY)/10;
      ctx.beginPath();
      for(let x=0;x<=LW;x+=14)ctx.lineTo(x,y+Math.sin(x*0.03+time*(1+i*0.15)+i*2)*3.5);
      ctx.stroke();}
    if(phase==='waiting'||phase==='bite'){
      const fx=bobX+Math.sin(time*0.8)*60, fy=bobY+40+Math.sin(time)*8;
      ctx.fillStyle='rgba(10,30,46,.35)';
      ctx.beginPath();ctx.ellipse(fx,fy,26,9,0,0,7);ctx.fill();
      ctx.beginPath();ctx.moveTo(fx-26,fy);ctx.lineTo(fx-40,fy-8);ctx.lineTo(fx-40,fy+8);ctx.closePath();ctx.fill();}
    if(phase==='fight'&&mode==='lure'&&targetFish){
      const fx=320+distance*480+fishDir*Math.sin(time*6)*10, fy=bobY+40;
      /* 鱼身颜色挂钩品质等级 */
    const tierCol=TIER_COLORS[targetFish.needTier];
    ctx.fillStyle=tierCol+'88';
      ctx.save();ctx.translate(fx,fy);ctx.scale(fishDir,1);
      ctx.beginPath();ctx.ellipse(0,0,26,9,0,0,7);ctx.fill();
      ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-40,-8);ctx.lineTo(-40,8);ctx.closePath();ctx.fill();
      ctx.restore();bobX=fx;}
    /* 码头 & 钓鱼人 */
    ctx.fillStyle='#8a5a33';
    ctx.fillRect(0,waterY-6,210,14);ctx.fillRect(30,waterY+8,12,LH-waterY);ctx.fillRect(160,waterY+8,12,LH-waterY);
    ctx.fillStyle='#6d4526';ctx.fillRect(0,waterY-6,210,4);
    const px=130,py=waterY-6;
    ctx.fillStyle='#264653';ctx.fillRect(px-8,py-26,6,26);ctx.fillRect(px+2,py-26,6,26);
    ctx.fillStyle=mode==='lure'?'#d63c3c':'#f4a261';ctx.fillRect(px-10,py-52,20,28);
    ctx.fillStyle='#f1c27d';ctx.fillRect(px-8,py-72,16,18);
    ctx.fillStyle='#e9c46a';ctx.fillRect(px-13,py-76,26,5);ctx.fillRect(px-7,py-84,14,9);
    const rodAngle=phase==='fight'?-0.9+(mode==='lure'?steer*0.25:0):-0.55;
    const rx=px+8,ry=py-46;
    const tipX=rx+Math.cos(rodAngle)*95,tipY=ry+Math.sin(rodAngle)*95;
    ctx.strokeStyle='#5a3a1e';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(tipX,tipY);ctx.stroke();
    if(phase!=='idle'&&phase!=='charging'&&phase!=='done'){
      ctx.strokeStyle=tension>0.95&&mode==='lure'&&phase==='fight'?'#d63c3c':'rgba(245,240,225,.7)';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(tipX,tipY);
      ctx.quadraticCurveTo((tipX+bobX)/2,Math.min(tipY,bobY)-30,bobX,bobY);ctx.stroke();
      const bob=Math.sin(time*3)*3+(phase==='bite'?Math.sin(time*22)*6:0);
      ctx.fillStyle='#d63c3c';ctx.beginPath();ctx.arc(bobX,bobY+bob,7,0,7);ctx.fill();
      ctx.fillStyle='#f5f0e1';ctx.fillRect(bobX-7,bobY+bob-1.5,14,3);
      ctx.strokeStyle='rgba(245,240,225,.4)';
      for(let i=0;i<2;i++){const rr=((time*30+i*20)%40);
        ctx.beginPath();ctx.ellipse(bobX,bobY+4,rr,rr*0.3,0,0,7);ctx.stroke();}}
    if(phase==='charging'){
      const bx=LW/2-150,by=LH-70,bw=300,bh=22;
      ctx.fillStyle='rgba(38,70,83,.75)';ctx.fillRect(bx-4,by-4,bw+8,bh+8);
      const g2=ctx.createLinearGradient(bx,0,bx+bw,0);
      g2.addColorStop(0,'#6abe30');g2.addColorStop(0.6,'#e9c46a');g2.addColorStop(1,'#d63c3c');
      ctx.fillStyle=g2;ctx.fillRect(bx,by,bw*castPower,bh);}
    /* 昼夜色调叠加 */
    if(tint[1]){ctx.fillStyle=tint[1];ctx.globalAlpha=tint[0];ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1;}
    if(phase==='bite'){
      ctx.fillStyle='#e9c46a';ctx.font='bold 44px sans-serif';ctx.textAlign='center';
      ctx.fillText('❗',bobX,bobY-40+Math.sin(time*10)*4);}
    if(phase==='fight'){
      if(mode==='float'){
        const barW=90,barH=LH-140,bx=LW/2-barW/2,by=80;
        ctx.fillStyle='rgba(38,70,83,.82)';ctx.fillRect(bx-8,by-8,barW+16,barH+16);
        ctx.fillStyle='rgba(245,240,225,.12)';ctx.fillRect(bx,by,barW,barH);
        const zh=0.16+line().strength*0.5;
        const zy=by+(zoneY-zh/2)*barH;
        ctx.fillStyle='rgba(106,190,48,.75)';ctx.fillRect(bx,zy,barW,zh*barH);
        const fy=by+fishY*barH;
        ctx.fillStyle=TIER_COLORS[targetFish.needTier];
        ctx.beginPath();ctx.ellipse(bx+barW/2,fy,18,9,0,0,7);ctx.fill();
        ctx.beginPath();ctx.moveTo(bx+barW/2-16,fy);ctx.lineTo(bx+barW/2-28,fy-8);ctx.lineTo(bx+barW/2-28,fy+8);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(245,240,225,.2)';ctx.fillRect(bx+barW+26,by,14,barH);
        ctx.fillStyle=progress>0.3?'#e9c46a':'#d63c3c';
        ctx.fillRect(bx+barW+26,by+barH*(1-progress),14,barH*progress);
      }else{
        /* 路亚沉浸 HUD */
        ctx.textAlign='center';
        ctx.fillStyle='#f5f0e1';ctx.font='bold 20px sans-serif';
        ctx.fillText(`${fname(targetFish)} [${T(TIER_KEYS[targetFish.needTier])}]`,LW/2,64);
        ctx.font='bold 30px sans-serif';
        ctx.fillStyle=distance<0.25?'#6abe30':'#f5f0e1';
        ctx.fillText(`${(distance*60).toFixed(1)} m`,LW/2,98);
        /* 体力/张力条：放右上角，避开左下摇杆与左下装备条 */
        const bw=190,bh=14,bx=LW-bw-24,by=96;
        ctx.fillStyle='rgba(38,70,83,.72)';ctx.fillRect(bx-8,by-22,bw+34,bh*2+50);
        ctx.fillStyle='#f5f0e1';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
        ctx.fillText(`🐟 ${T('stamina')}`,bx,by-6);
        ctx.fillStyle='rgba(245,240,225,.2)';ctx.fillRect(bx,by,bw,bh);
        ctx.fillStyle='#6abe30';ctx.fillRect(bx,by,bw*stamina,bh);
        ctx.fillStyle='#f5f0e1';ctx.fillText(`⚡ ${T('tension')}`,bx,by+bh+14);
        ctx.fillStyle='rgba(245,240,225,.2)';ctx.fillRect(bx,by+bh+18,bw,bh);
        ctx.fillStyle=tension>0.95?'#ff5252':'#e9c46a';
        ctx.fillRect(bx,by+bh+18,bw*Math.min(1,tension/1.3),bh);
        if(tension>0.95){ctx.fillStyle='#ff5252';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
          ctx.fillText('⚠',bx+bw+18,by+bh+30);}
        /* 拉杆方向标注：鱼往哪边冲，就提示往反方向拉 */
        ctx.textAlign='center';
        const needDir=-fishDir; /* 应该拉杆的方向 */
        ctx.font='bold 30px sans-serif';
        ctx.fillStyle='#f5f0e1';
        ctx.fillText(fishDir<0?'⬅':'➡',bobX,bobY-38+Math.sin(time*6)*3); /* 鱼的冲刺方向 */
        ctx.font='bold 15px sans-serif';
        const steerTxt=needDir<0?T('steerLeft'):T('steerRight');
        const ok=steer===needDir;
        ctx.fillStyle=ok?'#6abe30':'#e9c46a';
        ctx.fillText(steerTxt,bobX,bobY-16+Math.sin(time*6)*3);
        if(ok){ctx.strokeStyle='#6abe30';ctx.lineWidth=3;
          ctx.beginPath();ctx.arc(bobX,bobY+6,22+Math.sin(time*8)*3,0,7);ctx.stroke();}
      }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 游玩时长 & 自动保存 */
setInterval(()=>{S.playMinutes++;persist();},60000);
addEventListener('beforeunload',persist);

/* 尝试锁定横屏（支持的手机浏览器生效） */
document.addEventListener('click',()=>{
  if(document.documentElement.requestFullscreen&&matchMedia('(pointer:coarse)').matches&&!document.fullscreenElement){
    document.documentElement.requestFullscreen().then(()=>{
      if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
    }).catch(()=>{});
  }
},{once:true});

/* 初始化 */
if(unlockedAreas().length&&areaId>=unlockedAreas().length)areaId=0;
S.codexSeen=S.codexSeen||{};
applyI18n();renderHome();updateBadges();refreshHUD();
</script>
