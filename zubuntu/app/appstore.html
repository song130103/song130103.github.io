<script src="../script.js"></script>
<script>
function add(url,name,ico){
    const html = `<hr>
<div style="width:90%;aspect-ratio: 1 / 1;background:rgba(255,255,255,0.1);border-radius:50%;transition:all 0.3s ease;" oncontextmenu="removeSelection(event,&quot;${url}&quot;,&quot;${name}&quot;,&quot;${ico}&quot;)">
<img src="${ico}" style="width:100%;height:100%;object-fit:contain;transition:all 0.3s ease;border-radius:50%;" alt="${name}" onclick="location.href='${url}'">
</div>`;

    getItem('/usr/zdesktop/preference/desktop_icon.html', res => {
        // 容错：本地无存储则res为空字符串
        let old = res || "";
        // 新图标追加在底部
        const newAll = old + html;
        // 保存本地存储
        saveItemLS('/usr/zdesktop/preference/desktop_icon.html', newAll);

        // 修复1：判断桌面applist容器是否存在，避免报错无法添加
        alert('Add successfully. Please refresh Zhubuntu.');
    });
}
</script>
