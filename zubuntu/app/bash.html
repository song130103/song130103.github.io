<!DOCTYPE html>
<html>
<head>
  <title>Hello World</title>
  <style>
@font-face{
font-family: Consolas;
	src:url('Consolas.ttf') format('truetype');font-display: swap;	}
  </style>
</head>
<body style="color: white;background:black;font-family:Consolas,sans-serif;padding:0px"><div style="width:100%;height:6vh;background:#449944;color:white;padding:0"><center>Terminal</center></div>
  <div style="height:95%;width:100%;" id="output">Welcome to zhubuntu Terminal!(C)ZHUMENG(2024-2026) All right reserved.<br>Type 'help' for help and type '^' for ctrl key<br>Zreamer@zhubuntu:~$ </div>
  <input placeholder="Type and edit your commands here." style="position:absolute;top:95%;left:0;width:85%;background:black;margin:10px;color:white" id="ipt"></input>
  <button style="position:absolute;top:95%;left:87%;width:10%;background:black;margin:0px;height:3%;color:white" onclick="send()">Send</button>
 
   <script>
  let echo = 1;
  const ipt = document.getElementById('ipt');
  function send() {
	  const opt = document.getElementById('output');
	  if (echo==1) {
	      // 代码块
	  
 	 opt.innerHTML = opt.innerHTML+'<br>Zreamer@zhubuntu:~$ '+document.getElementById('ipt').value;
  }if (ipt.value=='version') {
 	opt.innerHTML = opt.innerHTML+'<br>zhubuntu by Zreamer and Song130103.Open-source in github.';
  }
  else if(ipt.value=='@echo off'){
 	 echo=0;
  }else if(ipt.value=='@echo on'){
 	 echo=1;
  }
  else if (ipt.value.slice(0,4)=='echo') {
	  opt.innerHTML = opt.innerHTML+'<br>'+ipt.value.replace('echo ','');
  }else if (ipt.value.trim()==='runjs') {
	  eval(ipt.value.replace('runjs',''));
  }else if (ipt.value.slice(0,4)=='sudo') {
      if(ipt.value.replace('sudo','')==''){opt.innerHTML = opt.innerHTML+`usage: sudo -h | -K | -k | -V<br>usage: sudo -v [-AknS] [-g group] [-h host] [-p prompt] [-u user]<br>usage: sudo -l [-AknS] [-g group] [-h host][-p prompt] [-U user] [-u user][command]<br>usage: sudo [-AbEHknPS] [-r role] [-t type][-C num] [-g group] [-h host][-p prompt] [-T timeout] [-uuser] [VAR=value] [-i|-s][<command>]<br>usage: sudo -e [-AknS] [-r role] [-t type][-C num] [-g group] [-h host][-p prompt] [-T timeout] [-uuser] file ...`;
  }}
  else {
 	 if (!(ipt.value=='')) {
 		 opt.innerHTML = opt.innerHTML+'<br>Bash:no such file or command';
	  }
  }
  ipt.value='';
  }
  </script>
</body>
</html>
