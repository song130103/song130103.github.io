<!DOCTYPE html>
<html>
<head>
  <title>Hello World</title>
  <style>
@font-face{
font-family: Consolas;
	src:url('Consolas.ttf') format('truetype');font-display: swap;	}
  </style>
</head>
<body style="color: white;background:black;font-family:Consolas,sans-serif;padding:0px"><div style="width:100%;height:6vh;background:#449944;color:white;padding:0"><center>Terminal</center></div>
  <div style="height:95%;width:100%;" id="output">Welcome to zhubuntu Terminal!(C)ZHUMENG(2024-2026) All right reserved.<br>Type 'help' for help and type '^' for ctrl key<br>$ </div>
  <input placeholder="Type and edit your commands here." style="position:absolute;top:95%;left:0;width:85%;background:black;margin:10px;color:white" id="ipt"></input>
  <button style="position:absolute;top:95%;left:87%;width:10%;background:black;margin:0px;height:3%;color:white" onclick="send()">Send</button>
 <script src="../script.js"></script>
   <script>
       function send(){
       document.getElementById('output').innerHTML=document.getElementById('output').innerHTML+ipt.value+'<br>'+eval(ipt.value)+'<br>$';ipt.value='';}
  </script>
</body>
</html>
